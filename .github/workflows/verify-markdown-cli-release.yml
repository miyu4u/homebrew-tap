name: Verify and Publish markdown-cli Release
run-name: Verify ${{ inputs.tag }} (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Staged markdown-cli release tag (vX.Y.Z)'
        required: true
        type: string
      request_id:
        description: 'Unique source run or manual request identifier'
        required: true
        type: string

concurrency:
  group: markdown-cli-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  HOMEBREW_NO_AUTOREMOVE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  MINIMUM_MACOS_VERSION: '15'

jobs:
  prepare:
    name: Verify staged asset set and render formula
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Checkout public tap only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate tag and release asset names
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          EXPECTED="$(printf '%s\n' \
            "checksums.txt" \
            "markdown-cli-v${VERSION}-darwin-arm64.tar.gz" \
            "markdown-cli-v${VERSION}-darwin-arm64.tar.gz.sha256" \
            "markdown-cli-v${VERSION}-darwin-x64.tar.gz" \
            "markdown-cli-v${VERSION}-darwin-x64.tar.gz.sha256" | sort)"
          ACTUAL="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort)"
          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "Release asset set differs from the immutable contract." >&2
            diff <(printf '%s\n' "${EXPECTED}") <(printf '%s\n' "${ACTUAL}")
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Download and verify every staged asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release-assets
          gh release download "${RELEASE_TAG}" --dir release-assets
          cd release-assets
          sha256sum --check checksums.txt
          sha256sum --check "markdown-cli-v${RELEASE_TAG#v}-darwin-arm64.tar.gz.sha256"
          sha256sum --check "markdown-cli-v${RELEASE_TAG#v}-darwin-x64.tar.gz.sha256"

      - name: Render candidate formula from verified hashes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARM64_SHA="$(awk '$2 ~ /darwin-arm64\.tar\.gz$/ { print $1 }' release-assets/checksums.txt)"
          X64_SHA="$(awk '$2 ~ /darwin-x64\.tar\.gz$/ { print $1 }' release-assets/checksums.txt)"
          test "${#ARM64_SHA}" -eq 64
          test "${#X64_SHA}" -eq 64
          mkdir -p formula-candidate
          cp release-assets/checksums.txt formula-candidate/checksums.txt
          printf '%s\n' \
            '# typed: false' \
            '# frozen_string_literal: true' \
            '' \
            '# Homebrew Formula for markdown-cli (standalone distribution without Node/Bun runtime dependency)' \
            'class MarkdownCli < Formula' \
            '  desc "Markdown repository inspection and maintenance"' \
            '  homepage "https://github.com/miyu4u/homebrew-tap"' \
            '  license "MIT"' \
            '' \
            '  depends_on macos: :sequoia' \
            '' \
            '  on_macos do' \
            '    on_arm do' \
            "      url \"https://github.com/miyu4u/homebrew-tap/releases/download/${RELEASE_TAG}/markdown-cli-v${VERSION}-darwin-arm64.tar.gz\"" \
            "      sha256 \"${ARM64_SHA}\"" \
            '    end' \
            '    on_intel do' \
            "      url \"https://github.com/miyu4u/homebrew-tap/releases/download/${RELEASE_TAG}/markdown-cli-v${VERSION}-darwin-x64.tar.gz\"" \
            "      sha256 \"${X64_SHA}\"" \
            '    end' \
            '  end' \
            '' \
            '  def install' \
            '    bin.install "md"' \
            '  end' \
            '' \
            '  test do' \
            '    assert_equal version.to_s, shell_output("#{bin}/md --version").strip' \
            '    assert_match "md", shell_output("#{bin}/md --help")' \
            '    (testpath/"test.md").write("# Test Document\n\nSample markdown content.\n")' \
            '    system bin/"md", "--no-config", "--root", testpath, "check-links", "test.md"' \
            '  end' \
            'end' > formula-candidate/markdown-cli.rb

      - name: Upload verified formula candidate and checksums
        uses: actions/upload-artifact@v4
        with:
          name: markdown-cli-formula-${{ inputs.request_id }}
          path: formula-candidate/
          if-no-files-found: error
          retention-days: 2

  native-homebrew:
    name: Native Homebrew verification (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            machine: arm64
            runner: macos-latest
          - target: darwin-x64
            machine: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout public tap only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download formula candidate
        uses: actions/download-artifact@v4
        with:
          name: markdown-cli-formula-${{ inputs.request_id }}
          path: formula-candidate

      - name: Download and verify draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "${RUNNER_TEMP}/release-assets"
          gh release download "${RELEASE_TAG}" --dir "${RUNNER_TEMP}/release-assets"
          cmp formula-candidate/checksums.txt "${RUNNER_TEMP}/release-assets/checksums.txt"
          cd "${RUNNER_TEMP}/release-assets"
          shasum -a 256 -c checksums.txt
          shasum -a 256 -c "markdown-cli-v${RELEASE_TAG#v}-darwin-arm64.tar.gz.sha256"
          shasum -a 256 -c "markdown-cli-v${RELEASE_TAG#v}-darwin-x64.tar.gz.sha256"

      - name: Verify native target, minimum macOS, and standalone behavior
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
          TARGET: ${{ matrix.target }}
        run: |
          test "$(uname -m)" = "${EXPECTED_MACHINE}"
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge "${MINIMUM_MACOS_VERSION}"
          VERSION="${RELEASE_TAG#v}"
          mkdir -p "${RUNNER_TEMP}/native" "${RUNNER_TEMP}/smoke-home" "${RUNNER_TEMP}/fixture"
          tar -xzf "${RUNNER_TEMP}/release-assets/markdown-cli-v${VERSION}-${TARGET}.tar.gz" -C "${RUNNER_TEMP}/native"
          test "$(env -i HOME="${RUNNER_TEMP}/smoke-home" PATH=/usr/bin:/bin:/usr/sbin:/sbin "${RUNNER_TEMP}/native/md" --version)" = "${VERSION}"
          env -i HOME="${RUNNER_TEMP}/smoke-home" PATH=/usr/bin:/bin:/usr/sbin:/sbin "${RUNNER_TEMP}/native/md" --help | grep -F md
          printf '# Fixture\n\nSample content.\n' > "${RUNNER_TEMP}/fixture/document.md"
          cp "${RUNNER_TEMP}/fixture/document.md" "${RUNNER_TEMP}/fixture/document.before.md"
          env -i HOME="${RUNNER_TEMP}/smoke-home" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "${RUNNER_TEMP}/native/md" --no-config --root "${RUNNER_TEMP}/fixture" check-links "${RUNNER_TEMP}/fixture/document.md"
          cmp "${RUNNER_TEMP}/fixture/document.before.md" "${RUNNER_TEMP}/fixture/document.md"

      - name: Exercise install, synthetic upgrade, test, audit, reinstall, uninstall, and link conflict
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          TAP_NAME="miyu4u/release-verify"
          brew tap-new "${TAP_NAME}"
          TAP_ROOT="$(brew --repository "${TAP_NAME}")"
          FORMULA_PATH="${TAP_ROOT}/Formula/markdown-cli.rb"
          ARM64_URL="https://github.com/miyu4u/homebrew-tap/releases/download/${RELEASE_TAG}/markdown-cli-v${VERSION}-darwin-arm64.tar.gz"
          X64_URL="https://github.com/miyu4u/homebrew-tap/releases/download/${RELEASE_TAG}/markdown-cli-v${VERSION}-darwin-x64.tar.gz"
          ARM64_LOCAL="file://${RUNNER_TEMP}/release-assets/markdown-cli-v${VERSION}-darwin-arm64.tar.gz"
          X64_LOCAL="file://${RUNNER_TEMP}/release-assets/markdown-cli-v${VERSION}-darwin-x64.tar.gz"
          cp formula-candidate/markdown-cli.rb "${RUNNER_TEMP}/public-formula.rb"
          ruby -e 'path, arm_url, arm_local, x64_url, x64_local, version = ARGV; content = File.read(path); content.sub!(arm_url, arm_local); content.sub!(x64_url, x64_local); content.sub!("  license", "  version \"#{version}\"\n  license"); File.write(path, content)' \
            formula-candidate/markdown-cli.rb "${ARM64_URL}" "${ARM64_LOCAL}" "${X64_URL}" "${X64_LOCAL}" "${VERSION}"
          cp formula-candidate/markdown-cli.rb "${FORMULA_PATH}"
          ruby -e 'path = ARGV.fetch(0); content = File.read(path).sub(%(version "'"${VERSION}"'"), %(version "0.0.0")); File.write(path, content)' "${FORMULA_PATH}"
          git -C "${TAP_ROOT}" config user.name github-actions
          git -C "${TAP_ROOT}" config user.email github-actions@users.noreply.github.com
          git -C "${TAP_ROOT}" add Formula/markdown-cli.rb
          git -C "${TAP_ROOT}" commit -m 'synthetic previous markdown-cli fixture'

          mkdir -p "${RUNNER_TEMP}/user-docs"
          printf '# User document\n' > "${RUNNER_TEMP}/user-docs/preserved.md"
          PRESERVED_SHA="$(shasum -a 256 "${RUNNER_TEMP}/user-docs/preserved.md" | awk '{ print $1 }')"
          printf 'roots: ["."]\n' > "${RUNNER_TEMP}/user-docs/markdown-cli.yaml"
          CONFIG_SHA="$(shasum -a 256 "${RUNNER_TEMP}/user-docs/markdown-cli.yaml" | awk '{ print $1 }')"
          brew install "${TAP_NAME}/markdown-cli"

          cp formula-candidate/markdown-cli.rb "${FORMULA_PATH}"
          git -C "${TAP_ROOT}" add Formula/markdown-cli.rb
          git -C "${TAP_ROOT}" commit -m "markdown-cli ${VERSION} fixture"
          brew upgrade "${TAP_NAME}/markdown-cli"
          test "$("$(brew --prefix markdown-cli)/bin/md" --version)" = "${VERSION}"
          brew test "${TAP_NAME}/markdown-cli"
          cp "${RUNNER_TEMP}/public-formula.rb" "${FORMULA_PATH}"
          brew audit --strict "${TAP_NAME}/markdown-cli"
          cp formula-candidate/markdown-cli.rb "${FORMULA_PATH}"
          (cd "${RUNNER_TEMP}/user-docs" && brew reinstall "${TAP_NAME}/markdown-cli")
          (cd "${RUNNER_TEMP}/user-docs" && "$(brew --prefix markdown-cli)/bin/md" check-links preserved.md)
          test "$("$(brew --prefix markdown-cli)/bin/md" --version)" = "${VERSION}"
          test "$(shasum -a 256 "${RUNNER_TEMP}/user-docs/preserved.md" | awk '{ print $1 }')" = "${PRESERVED_SHA}"
          test "$(shasum -a 256 "${RUNNER_TEMP}/user-docs/markdown-cli.yaml" | awk '{ print $1 }')" = "${CONFIG_SHA}"
          (cd "${RUNNER_TEMP}/user-docs" && brew uninstall --force "${TAP_NAME}/markdown-cli")
          test "$(shasum -a 256 "${RUNNER_TEMP}/user-docs/preserved.md" | awk '{ print $1 }')" = "${PRESERVED_SHA}"
          test "$(shasum -a 256 "${RUNNER_TEMP}/user-docs/markdown-cli.yaml" | awk '{ print $1 }')" = "${CONFIG_SHA}"

          ruby -e 'path = ARGV.fetch(0); File.write(path, File.read(path).gsub(/(?<=sha256 ")[a-f0-9]{64}/, "0" * 64))' "${FORMULA_PATH}"
          if brew fetch --force "${TAP_NAME}/markdown-cli"; then
            echo "Checksum mismatch must block installation." >&2
            exit 1
          fi
          cp formula-candidate/markdown-cli.rb "${FORMULA_PATH}"
          ruby -e 'path = ARGV.fetch(0); File.write(path, File.read(path).gsub(/file:\/\/[^"]+/, "file://#{ENV.fetch("RUNNER_TEMP")}/missing.tar.gz"))' "${FORMULA_PATH}"
          if brew fetch --force "${TAP_NAME}/markdown-cli"; then
            echo "Missing asset must block installation." >&2
            exit 1
          fi
          cp formula-candidate/markdown-cli.rb "${FORMULA_PATH}"

          LINK_PATH="$(brew --prefix)/bin/md"
          test ! -e "${LINK_PATH}"
          printf 'user-owned-md\n' > "${LINK_PATH}"
          chmod +x "${LINK_PATH}"
          set +e
          brew install "${TAP_NAME}/markdown-cli" > "${RUNNER_TEMP}/link-conflict.log" 2>&1
          CONFLICT_STATUS=$?
          set -e
          test "${CONFLICT_STATUS}" -ne 0
          grep -F 'Could not symlink bin/md' "${RUNNER_TEMP}/link-conflict.log"
          test "$(cat "${LINK_PATH}")" = 'user-owned-md'
          rm "${LINK_PATH}"
      - name: Clean Homebrew verification state
        if: always()
        run: |
          if brew list --formula markdown-cli >/dev/null 2>&1; then
            brew uninstall --force miyu4u/release-verify/markdown-cli
          fi
          if brew tap | grep -Fx 'miyu4u/release-verify'; then
            brew untap miyu4u/release-verify
          fi

  publish:
    name: Publish verified assets and update formula
    needs: [prepare, native-homebrew]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public tap with ephemeral built-in credential
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download verified formula candidate and checksums
        uses: actions/download-artifact@v4
        with:
          name: markdown-cli-formula-${{ inputs.request_id }}
          path: verified-prepare

      - name: Re-download and verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release-assets
          gh release download "${RELEASE_TAG}" --dir release-assets
          cmp verified-prepare/checksums.txt release-assets/checksums.txt
          cd release-assets
          sha256sum --check checksums.txt
          sha256sum --check "markdown-cli-v${RELEASE_TAG#v}-darwin-arm64.tar.gz.sha256"
          sha256sum --check "markdown-cli-v${RELEASE_TAG#v}-darwin-x64.tar.gz.sha256"

      - name: Publish complete draft without mutating assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          IS_DRAFT="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')"
          if [[ "${IS_DRAFT}" = 'true' ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false
          elif [[ "${IS_DRAFT}" != 'false' ]]; then
            echo "Unable to determine release state for ${RELEASE_TAG}." >&2
            exit 1
          fi

      - name: Commit formula after public asset verification
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p Formula
          cp verified-prepare/markdown-cli.rb Formula/markdown-cli.rb
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/markdown-cli.rb
          if git diff --cached --quiet --exit-code; then
            echo "Formula/markdown-cli.rb is already current."
          else
            git commit -m "markdown-cli ${VERSION}"
            git push origin HEAD:main
          fi

  public-install-verification:
    name: Public Homebrew installation verification (${{ matrix.target }})
    needs: [prepare, publish]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Verify clean public tap installation and standalone smoke
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/smoke-home" "${RUNNER_TEMP}/fixture"
          printf '# Public install fixture\n' > "${RUNNER_TEMP}/fixture/document.md"
          cp "${RUNNER_TEMP}/fixture/document.md" "${RUNNER_TEMP}/document.before"
          brew tap miyu4u/tap
          brew install miyu4u/tap/markdown-cli
          test "$("$(brew --prefix markdown-cli)/bin/md" --version)" = "${VERSION}"
          env -i HOME="${RUNNER_TEMP}/smoke-home" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$(brew --prefix markdown-cli)/bin/md" --version
          env -i HOME="${RUNNER_TEMP}/smoke-home" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$(brew --prefix markdown-cli)/bin/md" --help | grep -F md
          env -i HOME="${RUNNER_TEMP}/smoke-home" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$(brew --prefix markdown-cli)/bin/md" --no-config --root "${RUNNER_TEMP}/fixture" check-links document.md
          cmp "${RUNNER_TEMP}/document.before" "${RUNNER_TEMP}/fixture/document.md"
          brew test miyu4u/tap/markdown-cli
          brew audit --strict miyu4u/tap/markdown-cli
      - name: Teardown public verification tap
        if: always()
        run: |
          if brew list --formula markdown-cli >/dev/null 2>&1; then
            brew uninstall markdown-cli
          fi
          if brew tap | grep -Fx 'miyu4u/tap'; then
            brew untap miyu4u/tap
          fi
